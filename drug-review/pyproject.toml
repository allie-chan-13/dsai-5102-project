[project]
name = "drug-review"
version = "0.2.0"
description = "Drug review sentiment: official-split extensions beyond the course notebook"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "jupyter>=1.1",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "torch",
    "transformers>=4.46",
    "vaderSentiment>=3.3.2",
]

[project.scripts]
drug-review = "drug_review.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drug_review"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
